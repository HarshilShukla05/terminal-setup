# ─── Theme ─────────────────────────────────────────────
include themes/kanagawa.conf

# ─── Font ──────────────────────────────────────────────
font_family         JetBrainsMono Nerd Font
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           14.0
modify_font         cell_height 120%

# ─── Window ────────────────────────────────────────────
remember_window_size   no
initial_window_width   1200
initial_window_height  800
window_padding_width   0
hide_window_decorations titlebar-only
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000

# ─── Background image (swap bg.jpg with your wallpaper) ─
background_image          bg.jpg
background_image_layout   cscaled
background_image_linear   yes
background_tint           0.99
background_tint_gaps      1.0

# ─── Cursor ────────────────────────────────────────────
cursor_shape      block
cursor_blink_interval 0.5
cursor_trail      3
cursor_trail_decay 0.1 0.4

# ─── Tabs ──────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"

# ─── macOS ─────────────────────────────────────────────
macos_option_as_alt          yes
macos_quit_when_last_window_closed yes
macos_traditional_fullscreen yes

# ─── Keybindings ───────────────────────────────────────
# OS windows / tabs / splits inside one window
map cmd+n      new_os_window
map cmd+t      new_tab_with_cwd
map cmd+w      close_tab
map cmd+enter  new_window_with_cwd
map cmd+1      goto_tab 1
map cmd+2      goto_tab 2
map cmd+3      goto_tab 3
map cmd+4      goto_tab 4
map cmd+5      goto_tab 5

# tmux prefix bridge: Cmd+J sends Ctrl+J so tmux sees its prefix
map cmd+j  send_text all \x0a

# Font size
map cmd+plus   change_font_size all +1.0
map cmd+minus  change_font_size all -1.0
map cmd+0      change_font_size all 0

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Clear scrollback
map cmd+k clear_terminal to_cursor active
