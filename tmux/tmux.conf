# ─── General ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs
set -g mouse on
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on

# ─── Prefix ─────────────────────────────────────────────
# Ctrl+J is the tmux prefix. Kitty is configured to translate Cmd+J → Ctrl+J,
# so in practice you press Cmd+J on macOS.
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# ─── Reload config ──────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ─── Splits (keep cwd) ──────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Seamless nav with nvim (vim-tmux-navigator) ───────
# These bindings (Ctrl+h/j/k/l with NO prefix) let you move between tmux panes
# and nvim splits without thinking. Handled by the plugin below.

# ─── Copy-mode: vi keys ─────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ─── Status bar (Kanagawa Wave) ─────────────────────────
set-option -g status-position top
set -g status-justify centre
set -g status-interval 5

set -g status-style "fg=#dcd7ba,bg=#1f1f28"
set -g status-left-length 60
set -g status-right-length 80

set -g status-left "#[fg=#1f1f28,bg=#7e9cd8,bold] #S #[fg=#7e9cd8,bg=#1f1f28,nobold]"
set -g status-right "#[fg=#727169,bg=#1f1f28]#[fg=#dcd7ba,bg=#16161d] %H:%M #[fg=#e6c384,bg=#16161d] %d-%b-%y #[fg=#7e9cd8,bg=#16161d] #h "

setw -g window-status-format         "#[fg=#727169,bg=#1f1f28]  #I:#W  "
setw -g window-status-current-format "#[fg=#1f1f28,bg=#98bb6c,bold]  #I:#W  "
setw -g window-status-separator ""

# Make pane borders effectively invisible (so splits look borderless too)
set -g pane-border-style        "fg=#1f1f28"
set -g pane-active-border-style "fg=#1f1f28"

set -g message-style "fg=#1f1f28,bg=#e6c384,bold"

# Never show pane-border status lines (keeps pane area clean)
set -g pane-border-status off

# ─── Plugins (TPM) ──────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# plugin options
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @sessionx-bind 'o'

run '~/.config/tmux/plugins/tpm/tpm'
