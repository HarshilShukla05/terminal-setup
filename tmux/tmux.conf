# ─── General ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs
set -g mouse on
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on

# Window names are set deliberately (by tmux-sessionizer, tmux-claude, or
# prefix+,) and must stick. Left on, tmux and the running program rename every
# window after the process in it, so the status bar reads "nvim nvim nvim" and
# you can't tell which window holds what — or notice you've opened the same
# service twice.
set -g automatic-rename off
set -g allow-rename off

# ─── Prefix ─────────────────────────────────────────────
# Ctrl+J is the tmux prefix. Kitty is configured to translate Cmd+J → Ctrl+J,
# so in practice you press Cmd+J on macOS.
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# ─── Reload config ──────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ─── Splits (keep cwd) ──────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Sessions ───────────────────────────────────────────
# One session per project (a repo), long-lived and never named by hand. The
# ticket you're on lives in the git branch, shown in status-left — not in the
# session name, so there is nothing to name and nothing to clean up.
#
#   prefix+f   fuzzy-pick a project -> attach, or create it with 1:nvim 2:sh
#   prefix+o   fuzzy session switcher (tmux-sessionx)
#   prefix+a   toggle to claude at the workspace root, and back again
#   prefix+g   throwaway shell in a popup — for one-off commands that used to
#              turn into a whole extra session
#
# Each user customizes their project roots in ~/.config/tmux-sessionizer/paths.
bind-key -r f run-shell "tmux neww tmux-sessionizer"
bind-key a run-shell "tmux-claude"
bind-key g display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# Last-session toggle. Stock tmux puts this on prefix+L; Space is easier to
# reach and next-layout (its default) is of no use with one pane per window.
bind Space switch-client -l

# ─── Seamless nav with nvim (vim-tmux-navigator) ───────
# These bindings (Ctrl+h/j/k/l with NO prefix) let you move between tmux panes
# and nvim splits without thinking. Handled by the plugin below.

# ─── Copy-mode: vi keys ─────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ─── Status bar (Kanagawa Dragon) ───────────────────────
set-option -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5

set -g status-style "fg=#c5c9c5,bg=#181616"
set -g status-left-length 100
set -g status-right-length 100

# Session name (= the service) then the branch of the focused pane (= the
# ticket). Together they are the whole "where am I" answer, which is why the
# session name doesn't need to carry the ticket too.
set -g status-left "#[fg=#181616,bg=#7E9CD8,bold] #S #[fg=#7E9CD8,bg=#181616,nobold]#[fg=#E6C384,bg=#181616] #(tmux-branch '#{pane_current_path}') "
# Battery via tmux-plugins/tmux-battery (real %, dynamic icon, no scripting):
#   #{battery_icon_status}     -> charge-state icon (charging / discharging / full)
#   #{battery_percentage}      -> exact percent, e.g. "82%"
#   #{battery_color_fg}        -> color shifts with charge level
set -g status-right "#[fg=#625e5a,bg=#181616]#{battery_color_fg}#[bg=#0d0c0c] #{battery_percentage} #[fg=#c5c9c5,bg=#0d0c0c] %H:%M #[fg=#E6C384,bg=#0d0c0c] %d-%b-%y #[fg=#7E9CD8,bg=#0d0c0c] #h "


setw -g window-status-format         "#[fg=#625e5a,bg=#181616]  #I:#W  "
setw -g window-status-current-format "#[fg=#181616,bg=#98BB6C,bold]  #I:#W  "
setw -g window-status-separator ""

# Thin pane borders, dragon-matched. Subtle dark for inactive panes,
# wave-blue accent for the active pane.
set -g pane-border-lines        "single"
set -g pane-border-style        "fg=#393836"
set -g pane-active-border-style "fg=#7E9CD8"

set -g message-style "fg=#181616,bg=#E6C384,bold"

# Pane-border-status explicitly off — tmux remembers a previous "top" setting
# across source-file reloads unless we explicitly turn it off. With this off,
# there's no extra row between the status bar and the editor.
set -g pane-border-status off

# ─── Plugins (TPM) ──────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'

# plugin options
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @sessionx-bind 'o'

run '~/.config/tmux/plugins/tpm/tpm'
