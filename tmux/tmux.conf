# ─── General ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs
set -g mouse on
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on

# ─── Prefix ─────────────────────────────────────────────
# Ctrl+J is the tmux prefix. Kitty is configured to translate Cmd+J → Ctrl+J,
# so in practice you press Cmd+J on macOS.
unbind C-b
set -g prefix C-j
bind C-j send-prefix

# ─── Reload config ──────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ─── Splits (keep cwd) ──────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Project switcher (tmux-sessionizer) ────────────────
# prefix+f opens a fuzzy picker of your projects in a new tmux window.
# Each user customizes their project roots in ~/.config/tmux-sessionizer/paths.
bind-key -r f run-shell "tmux neww tmux-sessionizer"

# ─── Seamless nav with nvim (vim-tmux-navigator) ───────
# These bindings (Ctrl+h/j/k/l with NO prefix) let you move between tmux panes
# and nvim splits without thinking. Handled by the plugin below.

# ─── Copy-mode: vi keys ─────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ─── Status bar (Kanagawa Dragon) ───────────────────────
set-option -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5

set -g status-style "fg=#c5c9c5,bg=#181616"
set -g status-left-length 60
set -g status-right-length 100

set -g status-left "#[fg=#181616,bg=#658594,bold] #S #[fg=#658594,bg=#181616,nobold]"
# Battery via tmux-plugins/tmux-battery (real %, dynamic icon, no scripting):
#   #{battery_icon_status}     -> charge-state icon (charging / discharging / full)
#   #{battery_percentage}      -> exact percent, e.g. "82%"
#   #{battery_color_fg}        -> color shifts with charge level
set -g status-right "#[fg=#625e5a,bg=#181616]#{battery_color_fg}#[bg=#0d0c0c] #{battery_percentage} #[fg=#c5c9c5,bg=#0d0c0c] %H:%M #[fg=#c4b28a,bg=#0d0c0c] %d-%b-%y #[fg=#658594,bg=#0d0c0c] #h "


setw -g window-status-format         "#[fg=#625e5a,bg=#181616]  #I:#W  "
setw -g window-status-current-format "#[fg=#181616,bg=#87a987,bold]  #I:#W  "
setw -g window-status-separator ""

# Thin pane borders, dragon-matched. Subtle dark for inactive panes,
# dragon-blue accent for the active pane.
set -g pane-border-lines        "single"
set -g pane-border-style        "fg=#393836"
set -g pane-active-border-style "fg=#658594"

set -g message-style "fg=#181616,bg=#c4b28a,bold"

# Pane-border-status explicitly off — tmux remembers a previous "top" setting
# across source-file reloads unless we explicitly turn it off. With this off,
# there's no extra row between the status bar and the editor.
set -g pane-border-status off

# ─── Plugins (TPM) ──────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'

# plugin options
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @sessionx-bind 'o'

run '~/.config/tmux/plugins/tpm/tpm'
